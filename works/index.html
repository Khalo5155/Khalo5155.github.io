<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>诗集 | 滚动浏览 · 自适应背景色调</title>
    <style>
        /* ===== 全局重置 & 基础变量（默认深蓝） ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-page: #0d1b2a;
            --bg-card: rgba(20, 40, 70, 0.3);
            --bg-hover: rgba(30, 60, 100, 0.35);
            --bg-active: rgba(25, 50, 85, 0.4);
            --bg-selected: rgba(30, 55, 90, 0.45);
            --text-primary: #d6e6ff;
            --text-secondary: #9bb5d4;
            --text-light: #7a94b5;
            --accent: #4c78b5;
            --accent-light: #6f9edb;
            --border: rgba(75, 110, 160, 0.45);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            --radius: 14px;
            --radius-sm: 10px;
            --font-serif: 'Georgia', 'Times New Roman', '宋体', 'Songti SC', 'Noto Serif SC', serif;
            --font-sans: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --transition: 0.2s ease;
            --max-width: 1300px;
            --glass-bg: rgba(18, 40, 70, 0.3);
            --glass-bg-light: rgba(25, 50, 85, 0.3);
            --glass-bg-dark: rgba(15, 35, 60, 0.35);
            --glass-border: rgba(100, 140, 190, 0.25);
            --glass-opacity: 0.3;
            /* 正文字号基础变量，由JS调整 */
            --card-body-font-size: 1.08rem;
            --card-title-font-size: 1.9rem;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-image: linear-gradient(145deg, #0a1a2f 0%, #132b44 100%);
            transition: background-image 0.6s ease, background-color 0.6s ease;
            position: relative;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 20, 35, 0.4);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(80, 130, 190, 0.5);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(110, 160, 220, 0.7);
        }

        /* 主应用卡片 */
        .app {
            max-width: var(--max-width);
            width: 100%;
            background: var(--glass-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 90vh;
            min-height: 650px;
            border: 1px solid var(--glass-border);
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .header {
            padding: 20px 28px 16px 28px;
            border-bottom: 1px solid var(--border);
            background: var(--glass-bg-dark);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 20px;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.4s ease;
        }
        .header-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: var(--text-primary);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .header-title small {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-light);
            margin-left: 10px;
        }
        .header-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-active);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background 0.4s ease;
        }

        .main {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* 左侧目录 */
        .list-panel {
            width: 280px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            background: var(--glass-bg-light);
            display: flex;
            flex-direction: column;
            height: 100%;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.4s ease;
        }
        .list-header {
            padding: 16px 18px 12px 18px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            background: var(--glass-bg-dark);
            flex-shrink: 0;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0 16px 0;
            list-style: none;
        }

        .chapter-item {
            list-style: none;
            margin: 2px 0;
        }
        .chapter-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px 10px 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: var(--transition);
            border-left: 3px solid transparent;
            user-select: none;
        }
        .chapter-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .arrow {
            font-size: 0.7rem;
            width: 16px;
            text-align: center;
            color: var(--text-light);
            transition: transform 0.2s;
            display: inline-block;
        }
        .arrow.expanded {
            transform: rotate(90deg);
        }
        .chapter-label {
            flex: 1;
            font-family: var(--font-serif);
            letter-spacing: 0.5px;
        }
        .chapter-badge {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-light);
            background: var(--bg-selected);
            padding: 2px 10px;
            border-radius: 12px;
        }

        .poem-sublist {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.2s;
            max-height: 1600px;
            opacity: 1;
        }
        .poem-sublist.hidden {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }
        .poem-sublist li {
            padding: 7px 18px 7px 38px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }
        .poem-sublist li:hover {
            background: var(--bg-hover);
        }
        .poem-sublist li.active {
            background: var(--bg-active);
            border-left-color: var(--accent);
            font-weight: 500;
            color: var(--text-primary);
        }
        .poem-title {
            font-family: var(--font-serif);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .poem-date-mini {
            font-size: 0.7rem;
            color: var(--text-light);
            white-space: nowrap;
        }

        /* 右侧详情 */
        .detail-panel {
            flex: 1;
            overflow-y: auto;
            background: transparent;
            padding: 28px 32px 40px 32px;
            scroll-behavior: smooth;
        }

        .poem-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 24px 24px 28px 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
            scroll-margin-top: 20px;
            border: 1px solid var(--border);
            cursor: pointer; /* 新增：提示可点击，但无上浮动画 */
        }
        .poem-card:hover {
            background: var(--bg-hover);
            box-shadow: 0 4px 16px rgba(0, 10, 30, 0.4);
            /* 保持原有hover效果，没有transform上浮 */
        }
        .poem-card:last-child {
            margin-bottom: 0;
        }

        .poem-card .card-title {
            font-family: var(--font-serif);
            font-size: var(--card-title-font-size, 1.9rem);
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: 0.02em;
            transition: font-size 0.25s ease;
        }
        .poem-card .card-date {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 18px;
            display: inline-block;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .poem-card .card-body {
            font-family: var(--font-serif);
            font-size: var(--card-body-font-size, 1.08rem);
            line-height: 2;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 14px;
            transition: font-size 0.25s ease;
        }
        .poem-card .card-description {
            font-size: 0.92rem;
            color: var(--text-secondary);
            font-style: italic;
            border-left: 3px solid var(--accent-light);
            padding-left: 16px;
            margin-top: 8px;
            letter-spacing: 0.3px;
            line-height: 1.6;
        }
        .poem-card .card-description::before {
            content: "✧ ";
            color: var(--accent);
            font-style: normal;
            font-size: 0.9rem;
        }

        .empty-message,
        .loading-message {
            text-align: center;
            color: var(--text-light);
            padding: 60px 20px;
            font-size: 1rem;
        }

        /* 右下角字号调整按钮 */
        .font-size-adjuster {
            position: fixed;
            bottom: 28px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg-dark);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 8px 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            z-index: 1000;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s;
            user-select: none;
        }
        .font-size-adjuster button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: 600;
            transition: background 0.2s, color 0.2s, transform 0.1s;
            background: var(--bg-active);
            line-height: 1;
        }
        .font-size-adjuster button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .font-size-adjuster button:active {
            transform: scale(0.92);
        }
        .font-size-adjuster .size-indicator {
            min-width: 40px;
            text-align: center;
            font-size: 0.85rem;
            font-weight:500;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        @media (max-width: 820px) {
            body { padding: 10px; }
            .app { height: 95vh; min-height: 500px; }
            .main { flex-direction: column; }
            .list-panel {
                width: 100%;
                max-height: 220px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .detail-panel { padding: 18px 18px 28px 18px; }
            .poem-card .card-title { font-size: calc(var(--card-title-font-size, 1.9rem) * 0.85); }
            .font-size-adjuster {
                bottom: 16px;
                right: 16px;
                padding: 6px 10px;
                gap: 4px;
            }
            .font-size-adjuster button {
                width: 28px;
                height: 28px;
                font-size: 1.1rem;
            }
            .font-size-adjuster .size-indicator {
                min-width: 34px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <header class="header">
            <div class="header-title">叶之梦 <small>诗集</small></div>
            <div class="header-count" id="totalCount">共 0 首</div>
        </header>

        <div class="main">
            <section class="list-panel" id="listPanel">
                <div class="list-header">
                    <span>目录</span>
                    <span id="listCount">0 首</span>
                </div>
                <ul class="tree-container" id="treeContainer">
                    <li class="empty-message">加载中...</li>
                </ul>
            </section>

            <section class="detail-panel" id="detailPanel">
                <div class="loading-message">正在翻阅诗集…</div>
            </section>
        </div>
    </div>

    <!-- 右下角字号调整按钮 -->
    <div class="font-size-adjuster" id="fontSizeAdjuster" title="调整正文字号">
        <button id="fontDecrease" aria-label="缩小字号">−</button>
        <span class="size-indicator" id="fontSizeIndicator">100%</span>
        <button id="fontIncrease" aria-label="增大字号">+</button>
    </div>

    <script>
        (function() {
            'use strict';

            // DOM 元素
            const treeContainer = document.getElementById('treeContainer');
            const detailPanel = document.getElementById('detailPanel');
            const totalCountSpan = document.getElementById('totalCount');
            const listCountSpan = document.getElementById('listCount');

            // 字号调整相关
            const fontSizeAdjuster = document.getElementById('fontSizeAdjuster');
            const fontDecreaseBtn = document.getElementById('fontDecrease');
            const fontIncreaseBtn = document.getElementById('fontIncrease');
            const fontSizeIndicator = document.getElementById('fontSizeIndicator');
            const rootStyles = document.documentElement;

            // 字号调整状态
            let bodyFontSize = 1.08;
            let titleFontSize = 1.9;
            const MIN_BODY = 0.85;
            const MAX_BODY = 1.8;
            const MIN_TITLE = 1.4;
            const MAX_TITLE = 2.6;
            const STEP = 0.1;
            const TITLE_STEP = 0.15;

            function updateFontSizeIndicator() {
                const percent = Math.round((bodyFontSize / 1.08) * 100);
                fontSizeIndicator.textContent = percent + '%';
            }

            function applyFontSizeVariables() {
                rootStyles.style.setProperty('--card-body-font-size', bodyFontSize + 'rem');
                rootStyles.style.setProperty('--card-title-font-size', titleFontSize + 'rem');
            }

            function increaseFont() {
                if (bodyFontSize < MAX_BODY) {
                    bodyFontSize = Math.min(bodyFontSize + STEP, MAX_BODY);
                    titleFontSize = Math.min(titleFontSize + TITLE_STEP, MAX_TITLE);
                    applyFontSizeVariables();
                    updateFontSizeIndicator();
                }
            }

            function decreaseFont() {
                if (bodyFontSize > MIN_BODY) {
                    bodyFontSize = Math.max(bodyFontSize - STEP, MIN_BODY);
                    titleFontSize = Math.max(titleFontSize - TITLE_STEP, MIN_TITLE);
                    applyFontSizeVariables();
                    updateFontSizeIndicator();
                }
            }

            fontIncreaseBtn.addEventListener('click', increaseFont);
            fontDecreaseBtn.addEventListener('click', decreaseFont);
            applyFontSizeVariables();
            updateFontSizeIndicator();

            // 数据状态
            let allPoems = [];
            let grouped = {};
            let chapters = [];
            let expandedState = {};
            let currentActiveIndex = null;
            let currentBackgroundKey = null;

            function getChapterLabel(chapter) {
                if (typeof chapter === 'number') {
                    const map = ['一','二','三','四','五','六','七','八','九','十'];
                    return `第${map[chapter-1] || chapter}章`;
                }
                if (typeof chapter === 'string' && /^第.{1,2}章$/.test(chapter)) return chapter;
                return String(chapter);
            }

            function getChapterSortKey(chapter) {
                if (typeof chapter === 'number') return chapter;
                const match = String(chapter).match(/(\d+)/);
                if (match) return parseInt(match[1], 10);
                const map = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
                for (const [cn, num] of Object.entries(map)) {
                    if (String(chapter).includes(cn)) return num;
                }
                return 999;
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            // ========== 背景图片查找增加前缀 ==========
            function updateBackgroundForPoem(poem) {
                if (!poem) return;

                const titleKey = poem.title;
                const chapterKey = String(poem.chapter);

                const poemImagePath = `./pics/poem-${titleKey}.png`;

                const img = new Image();
                img.crossOrigin = 'anonymous';

                img.onload = function() {
                    const bgKey = `poem:${titleKey}`;
                    if (currentBackgroundKey === bgKey) return;
                    currentBackgroundKey = bgKey;
                    document.body.style.backgroundImage = `url('${poemImagePath}')`;
                    extractAndApplyTheme(img);
                };

                img.onerror = function() {
                    const chapterImagePath = `./pics/chapter-${chapterKey}.png`;
                    const chapterImg = new Image();
                    chapterImg.crossOrigin = 'anonymous';

                    chapterImg.onload = function() {
                        const bgKey = `chapter:${chapterKey}`;
                        if (currentBackgroundKey === bgKey) return;
                        currentBackgroundKey = bgKey;
                        document.body.style.backgroundImage = `url('${chapterImagePath}')`;
                        extractAndApplyTheme(chapterImg);
                    };

                    chapterImg.onerror = function() {
                        const bgKey = 'default';
                        if (currentBackgroundKey === bgKey) return;
                        currentBackgroundKey = bgKey;
                        document.body.style.backgroundImage = '';
                        applyDefaultTheme();
                    };

                    chapterImg.src = chapterImagePath;
                };

                img.src = poemImagePath;
            }

            function extractAndApplyTheme(img) {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 80;
                    const ratio = Math.min(maxDim / img.naturalWidth, maxDim / img.naturalHeight);
                    canvas.width = Math.max(1, Math.round(img.naturalWidth * ratio));
                    canvas.height = Math.max(1, Math.round(img.naturalHeight * ratio));

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                    let r = 0, g = 0, b = 0, count = 0;
                    for (let i = 0; i < imageData.length; i += 4) {
                        const alpha = imageData[i + 3];
                        if (alpha > 100) {
                            r += imageData[i];
                            g += imageData[i + 1];
                            b += imageData[i + 2];
                            count++;
                        }
                    }
                    if (count === 0) {
                        applyDefaultTheme();
                        return;
                    }
                    r = Math.round(r / count);
                    g = Math.round(g / count);
                    b = Math.round(b / count);

                    const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                    const isDark = brightness < 128;

                    let uiBrightness;
                    if (isDark) {
                        uiBrightness = brightness * 0.7;
                    } else {
                        uiBrightness = Math.min(255, brightness * 1.25);
                    }

                    const brightnessRatio = uiBrightness / (brightness || 1);
                    let uiR = Math.round(r * brightnessRatio);
                    let uiG = Math.round(g * brightnessRatio);
                    let uiB = Math.round(b * brightnessRatio);

                    uiR = Math.max(0, Math.min(255, uiR));
                    uiG = Math.max(0, Math.min(255, uiG));
                    uiB = Math.max(0, Math.min(255, uiB));

                    const finalUiBrightness = (uiR * 299 + uiG * 587 + uiB * 114) / 1000;

                    const isUiDark = finalUiBrightness < 128;
                    const textPrimary = isUiDark ? '#f0f4fa' : '#1a2a3a';
                    const textSecondary = isUiDark ? '#c0d0e8' : '#3a4a5a';
                    const textLight = isUiDark ? '#8da5c0' : '#6a7a8a';
                    const accent = isUiDark ? '#7fa8d9' : '#3a6ea5';
                    const accentLight = isUiDark ? '#a5c8ed' : '#5a8ab5';

                    const alpha = 0.2;
                    const cardRgba = (r, g, b, a) => `rgba(${r}, ${g}, ${b}, ${a})`;

                    const pageBg = isUiDark
                        ? `rgb(${Math.max(0, uiR-30)}, ${Math.max(0, uiG-30)}, ${Math.max(0, uiB-30)})`
                        : `rgb(${Math.min(255, uiR+30)}, ${Math.min(255, uiG+30)}, ${Math.min(255, uiB+30)})`;

                    const root = document.documentElement;
                    root.style.setProperty('--bg-page', pageBg);
                    root.style.setProperty('--text-primary', textPrimary);
                    root.style.setProperty('--text-secondary', textSecondary);
                    root.style.setProperty('--text-light', textLight);
                    root.style.setProperty('--accent', accent);
                    root.style.setProperty('--accent-light', accentLight);

                    const bgCard = cardRgba(uiR, uiG, uiB, alpha);
                    const bgHover = cardRgba(Math.min(255, uiR+30), Math.min(255, uiG+30), Math.min(255, uiB+30), alpha+0.05);
                    const bgActive = cardRgba(Math.max(0, uiR-10), Math.max(0, uiG-10), Math.max(0, uiB-10), alpha+0.08);
                    const bgSelected = cardRgba(uiR, uiG, uiB, alpha+0.1);
                    const borderColor = cardRgba(uiR, uiG, uiB, 0.4);
                    const shadowColor = isUiDark ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,0.2)';
                    const glassBg = cardRgba(uiR, uiG, uiB, alpha);
                    const glassBgLight = cardRgba(uiR, uiG, uiB, alpha+0.02);
                    const glassBgDark = cardRgba(Math.max(0, uiR-15), Math.max(0, uiG-15), Math.max(0, uiB-15), alpha+0.02);

                    root.style.setProperty('--bg-card', bgCard);
                    root.style.setProperty('--bg-hover', bgHover);
                    root.style.setProperty('--bg-active', bgActive);
                    root.style.setProperty('--bg-selected', bgSelected);
                    root.style.setProperty('--border', borderColor);
                    root.style.setProperty('--shadow', `0 8px 30px ${shadowColor}`);
                    root.style.setProperty('--glass-bg', glassBg);
                    root.style.setProperty('--glass-bg-light', glassBgLight);
                    root.style.setProperty('--glass-bg-dark', glassBgDark);
                    root.style.setProperty('--glass-border', borderColor);
                    root.style.setProperty('--glass-opacity', alpha);

                    document.body.style.backgroundColor = pageBg;
                } catch (e) {
                    console.warn('提取颜色失败', e);
                    applyDefaultTheme();
                }
            }

            function applyDefaultTheme() {
                const root = document.documentElement;
                root.style.setProperty('--bg-page', '#0d1b2a');
                root.style.setProperty('--text-primary', '#d6e6ff');
                root.style.setProperty('--text-secondary', '#9bb5d4');
                root.style.setProperty('--text-light', '#7a94b5');
                root.style.setProperty('--accent', '#4c78b5');
                root.style.setProperty('--accent-light', '#6f9edb');
                root.style.setProperty('--bg-card', 'rgba(20, 40, 70, 0.3)');
                root.style.setProperty('--bg-hover', 'rgba(30, 60, 100, 0.35)');
                root.style.setProperty('--bg-active', 'rgba(25, 50, 85, 0.4)');
                root.style.setProperty('--bg-selected', 'rgba(30, 55, 90, 0.45)');
                root.style.setProperty('--border', 'rgba(75, 110, 160, 0.45)');
                root.style.setProperty('--shadow', '0 8px 30px rgba(0, 0, 0, 0.35)');
                root.style.setProperty('--glass-bg', 'rgba(18, 40, 70, 0.3)');
                root.style.setProperty('--glass-bg-light', 'rgba(25, 50, 85, 0.3)');
                root.style.setProperty('--glass-bg-dark', 'rgba(15, 35, 60, 0.35)');
                root.style.setProperty('--glass-border', 'rgba(100, 140, 190, 0.25)');
                document.body.style.backgroundColor = '#0d1b2a';
            }

            // ========== 数据加载 ==========
            async function loadPoetryData() {
                try {
                    const response = await fetch('./poetry.jsonl');
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();
                    const lines = text.split('\n').filter(line => line.trim() !== '');

                    const poems = lines.map((line, idx) => {
                        try {
                            const obj = JSON.parse(line);
                            return {
                                title: obj.title || '无题',
                                date: obj.date || '',
                                content: obj.content || '',
                                description: obj.description || '',
                                chapter: obj.chapter !== undefined ? obj.chapter : 1,
                                _index: idx,
                            };
                        } catch (e) {
                            console.warn('解析错误行:', idx+1, line);
                            return null;
                        }
                    }).filter(p => p !== null);

                    if (poems.length === 0) throw new Error('未找到有效诗歌');
                    allPoems = poems;

                    grouped = {};
                    allPoems.forEach(p => {
                        const key = String(p.chapter);
                        if (!grouped[key]) grouped[key] = [];
                        grouped[key].push(p);
                    });

                    chapters = Object.keys(grouped).sort((a,b) => getChapterSortKey(a) - getChapterSortKey(b));
                    chapters.forEach(ch => { expandedState[ch] = true; });

                    totalCountSpan.textContent = `共 ${allPoems.length} 首`;
                    listCountSpan.textContent = `${allPoems.length} 首`;

                    renderDirectoryTree();
                    renderAllPoemsInDetail();

                    if (allPoems.length > 0) {
                        setActivePoem(allPoems[0]._index, false);
                        updateBackgroundForPoem(allPoems[0]);
                    }
                } catch (error) {
                    console.error(error);
                    detailPanel.innerHTML = `<div class="empty-message">❌ 加载失败：${error.message}<br><small>请确认 poetry.jsonl 存在</small></div>`;
                    treeContainer.innerHTML = `<li class="empty-message">数据错误</li>`;
                    totalCountSpan.textContent = '共 0 首';
                    listCountSpan.textContent = '0 首';
                }
            }

            function renderDirectoryTree() {
                if (!chapters.length) {
                    treeContainer.innerHTML = '<li class="empty-message">暂无章节</li>';
                    return;
                }
                const frag = document.createDocumentFragment();
                chapters.forEach(ch => {
                    const poems = grouped[ch] || [];
                    const label = getChapterLabel(ch);
                    const isExpanded = expandedState[ch] !== false;

                    const chapterItem = document.createElement('li');
                    chapterItem.className = 'chapter-item';

                    const toggleDiv = document.createElement('div');
                    toggleDiv.className = 'chapter-toggle';
                    toggleDiv.dataset.chapter = ch;
                    toggleDiv.innerHTML = `
                        <span class="arrow ${isExpanded ? 'expanded' : ''}">▸</span>
                        <span class="chapter-label">${escapeHtml(label)}</span>
                        <span class="chapter-badge">${poems.length}</span>
                    `;
                    toggleDiv.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleChapterCollapse(ch);
                    });

                    const subList = document.createElement('ul');
                    subList.className = `poem-sublist ${isExpanded ? '' : 'hidden'}`;
                    subList.dataset.chapter = ch;

                    if (poems.length === 0) {
                        const emptyLi = document.createElement('li');
                        emptyLi.textContent = '（暂无诗歌）';
                        emptyLi.style.color = 'var(--text-light)';
                        emptyLi.style.fontStyle = 'italic';
                        emptyLi.style.cursor = 'default';
                        emptyLi.style.paddingLeft = '38px';
                        subList.appendChild(emptyLi);
                    } else {
                        poems.forEach(p => {
                            const li = document.createElement('li');
                            li.dataset.poemIndex = p._index;
                            li.innerHTML = `
                                <span class="poem-title">${escapeHtml(p.title)}</span>
                                <span class="poem-date-mini">${p.date || ''}</span>
                            `;
                            li.addEventListener('click', (e) => {
                                e.stopPropagation();
                                scrollToPoemCard(p._index);
                                setActivePoem(p._index, true);
                            });
                            subList.appendChild(li);
                        });
                    }

                    chapterItem.appendChild(toggleDiv);
                    chapterItem.appendChild(subList);
                    frag.appendChild(chapterItem);
                });

                treeContainer.innerHTML = '';
                treeContainer.appendChild(frag);
                applyActiveHighlight();
            }

            function toggleChapterCollapse(chapterKey) {
                expandedState[chapterKey] = !expandedState[chapterKey];
                const subList = treeContainer.querySelector(`.poem-sublist[data-chapter="${chapterKey}"]`);
                const toggle = treeContainer.querySelector(`.chapter-toggle[data-chapter="${chapterKey}"]`);
                if (subList) subList.classList.toggle('hidden');
                if (toggle) {
                    const arrow = toggle.querySelector('.arrow');
                    if (arrow) arrow.classList.toggle('expanded');
                }
            }

            function renderAllPoemsInDetail() {
                if (!allPoems.length) {
                    detailPanel.innerHTML = `<div class="empty-message">📭 暂无诗歌</div>`;
                    return;
                }
                let html = '';
                allPoems.forEach(p => {
                    const hasDesc = p.description && p.description.trim() !== '';
                    html += `
                        <div class="poem-card" id="poem-${p._index}" data-poem-index="${p._index}" data-chapter="${p.chapter}">
                            <div class="card-title">${escapeHtml(p.title)}</div>
                            ${p.date ? `<div class="card-date">${escapeHtml(p.date)}</div>` : ''}
                            <div class="card-body">${escapeHtml(p.content)}</div>
                            ${hasDesc ? `<div class="card-description">${escapeHtml(p.description)}</div>` : ''}
                        </div>
                    `;
                });
                detailPanel.innerHTML = html;

                // 新增：为每个 poem-card 添加点击事件监听器
                // detailPanel.querySelectorAll('.poem-card').forEach(card => {
                //     card.addEventListener('click', function(e) {
                //         // 如果点击的是卡片内部，但目标是卡片本身或者子元素，都触发跳转
                //         // 但避免与可能的文字选择冲突，使用 closest 确保点击在卡片内任意位置
                //         const clickedCard = e.target.closest('.poem-card');
                //         if (!clickedCard) return;
                //         const index = parseInt(clickedCard.dataset.poemIndex, 10);
                //         if (!isNaN(index)) {
                //             // 滚动到对应的诗（即卡片本身）
                //             scrollToPoemCard(index);
                //             // 同时更新目录高亮
                //             setActivePoem(index, false); // 不强制滚动目录，避免跳动
                //         }
                //     });
                // });
            }

            function scrollToPoemCard(index) {
                const card = document.getElementById(`poem-${index}`);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    const target = detailPanel.querySelector(`.poem-card[data-poem-index="${index}"]`);
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            function setActivePoem(index, shouldScrollIntoView = false) {
                if (currentActiveIndex === index) {
                    if (shouldScrollIntoView) {
                        const activeLi = treeContainer.querySelector(`li[data-poem-index="${index}"]`);
                        if (activeLi) activeLi.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }
                    return;
                }
                currentActiveIndex = index;
                applyActiveHighlight();

                const poem = allPoems.find(p => p._index === index);
                if (poem) {
                    const chKey = String(poem.chapter);
                    if (expandedState[chKey] === false) {
                        expandedState[chKey] = true;
                        const subList = treeContainer.querySelector(`.poem-sublist[data-chapter="${chKey}"]`);
                        const toggle = treeContainer.querySelector(`.chapter-toggle[data-chapter="${chKey}"]`);
                        if (subList) subList.classList.remove('hidden');
                        if (toggle) {
                            const arrow = toggle.querySelector('.arrow');
                            if (arrow) arrow.classList.add('expanded');
                        }
                    }
                    updateBackgroundForPoem(poem);
                }

                if (shouldScrollIntoView) {
                    const activeLi = treeContainer.querySelector(`li[data-poem-index="${index}"]`);
                    if (activeLi) activeLi.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }

            function applyActiveHighlight() {
                treeContainer.querySelectorAll('li[data-poem-index]').forEach(li => li.classList.remove('active'));
                if (currentActiveIndex !== null) {
                    const activeLi = treeContainer.querySelector(`li[data-poem-index="${currentActiveIndex}"]`);
                    if (activeLi) activeLi.classList.add('active');
                }
            }

            function setupScrollSpy() {
                const panel = detailPanel;
                if (!panel) return;
                panel.addEventListener('scroll', () => {
                    if (!allPoems.length) return;
                    const cards = panel.querySelectorAll('.poem-card');
                    if (!cards.length) return;
                    const panelRect = panel.getBoundingClientRect();
                    let closestIndex = null;
                    let minDistance = Infinity;
                    cards.forEach(card => {
                        const index = parseInt(card.dataset.poemIndex, 10);
                        const rect = card.getBoundingClientRect();
                        const cardTopRelativeToPanel = rect.top - panelRect.top;
                        if (cardTopRelativeToPanel <= 150) {
                            const distance = Math.abs(cardTopRelativeToPanel);
                            if (distance < minDistance) {
                                minDistance = distance;
                                closestIndex = index;
                            }
                        }
                    });
                    if (closestIndex === null && cards.length > 0) {
                        closestIndex = parseInt(cards[0].dataset.poemIndex, 10);
                    }
                    if (closestIndex !== null && closestIndex !== currentActiveIndex) {
                        setActivePoem(closestIndex, false);
                    }
                }, { passive: true });
            }

            window.addEventListener('load', () => {
                setupScrollSpy();
            });

            async function init() {
                detailPanel.innerHTML = `<div class="loading-message"><div style="margin-bottom:8px;">⏳</div>载入诗集…</div>`;
                await loadPoetryData();
                setupScrollSpy();
            }

            init();
        })();
    </script>
</body>
